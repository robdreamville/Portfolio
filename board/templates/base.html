<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ common.first_name }} {{ common.last_name }}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Roberto Galdamez - AI systems builder. NeuraStream multi-agent platform, SportsOracle NLP analytics. AI operations, implementation, and technical support.">
    <meta name="keywords" content="AI operations, AI agents, LangGraph, NLP, Python, portfolio, Roberto Galdamez">

    <!-- social preview card -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Roberto Galdamez — AI Systems Builder">
    <meta property="og:description" content="I build AI systems that do real work: multi-agent platforms, NLP pipelines, and the evaluation loops that keep them honest.">
    <meta property="og:image" content="{{ url_for('static', filename='images/og-card.png', _external=True) }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Roberto Galdamez — AI Systems Builder">
    <meta name="twitter:description" content="I build AI systems that do real work: multi-agent platforms, NLP pipelines, and the evaluation loops that keep them honest.">
    <meta name="twitter:image" content="{{ url_for('static', filename='images/og-card.png', _external=True) }}">

    <!--fonts-->
    <link rel='stylesheet'
          href='https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i,800,800i|Source+Code+Pro:400,500,600,700'
          type='text/css' media='screen'/>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans|Roboto:900" rel="stylesheet">

    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename = 'css/base.css') }}">
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename = 'css/animations.css') }}">
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename = 'css/modern.css') }}">

    {% block head %}
    {% endblock %}
</head>
<body>
<script>
  /* Dark mode starts ON by default; only stays light if the user explicitly chose it. */
  try {
    if (localStorage.getItem('darkMode') !== 'false') document.body.classList.add('dark-mode');
  } catch (e) { document.body.classList.add('dark-mode'); }
</script>
<div class="navbar-ul">
    <button id="nav-toggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <ul id="navbar-list" class="list-inline">
        <li><a class="navbar-ref" href="/">Home</a></li>
        <li><a class="navbar-ref" href="/timeline">Timeline</a></li>
        <li><a class="navbar-ref" href="/skills">Skills</a></li>
        <li><a class="navbar-ref" href="/projects">Projects</a></li>
        <li><a class="navbar-ref" href="/reading">Reading</a></li>
        <li><a class="navbar-ref" href="/contact">Contact</a></li>
    </ul>
    <div class="navbar-controls">
        <button id="dark-mode-toggle" class="theme-toggle" title="Toggle Dark Mode">
            🌙
        </button>
    </div>
</div>
{% block body %}
{% endblock %}

<footer class="site-footer">
    <div class="foot-links">
        <a href="/projects">Projects</a>
        <a href="/timeline">Timeline</a>
        <a href="/contact">Contact</a>
        <a target="_blank" href="https://github.com/robdreamville">GitHub</a>
        <a target="_blank" href="https://www.linkedin.com/in/roberto-galdamez/">LinkedIn</a>
    </div>
    <p>Roberto Galdamez &mdash; Jersey City, NJ</p>
</footer>

<script src="{{ url_for('static', filename = 'js/portfolio.js') }}"></script>
</body>
</html>

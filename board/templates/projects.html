{% extends "base.html" %}

{% block head %}
<link type="text/css" rel="stylesheet" href="{{ url_for('static', filename = 'css/projects.css') }}">
{% endblock %}

{% block body %}
<main class="projects-page">
    <p class="eyebrow">Selected work</p>
    <h1 class="section-title">Projects</h1>
    <p class="section-subtitle">Things I've built that actually work.</p>

    {% if tag is not none %}
    <div class="active-filter">
        <span>Filtered by <strong>{{ tag }}</strong></span>
        <a href="/projects" class="clear-filter">&times; clear</a>
    </div>
    {% endif %}

    <div class="project-grid">
        {% for project in projects %}
        {% include "card.html" %}
        {% endfor %}
    </div>
</main>
{% endblock %}
